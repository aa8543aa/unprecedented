name: ✨ 기능
description: 새 기능 또는 기능 개선
title: 'feat: '
labels: ['type: feature']
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 기능으로 사용자가 무엇을 할 수 있게 되나요?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇이 확인되면 이 이슈를 닫을 수 있나요?
  - type: dropdown
    id: phase
    attributes:
      label: 단계
      options:
        - MVP
        - post-MVP
    validations:
      required: true
